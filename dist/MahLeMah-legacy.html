  <title>Mah了个Mah（兼容版）</title>
  <style>

   v2.0.0：与网页版一致改为暖白 / 奶油底 + 深棕文字。 */

* { margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #F7EEDC;
  color: #4A3524;
  font-family: "Microsoft YaHei", "SimHei", "Segoe UI", sans-serif;
}

#stage {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#game {
  display: block;
  background-color: #FFFDF6;
}

noscript {
  position: absolute;
  top: 40%;
  left: 0;
  width: 100%;
  text-align: center;
  color: #4A3524;
  font-size: 18px;
}
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="720" height="1280"></canvas>
  </div>
  <noscript>本游戏需要启用 JavaScript。</noscript>

  <script>
