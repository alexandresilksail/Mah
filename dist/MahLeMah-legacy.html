  <title>Mah了个Mah（兼容版）</title>

  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #191009;
  color: #F0E5D2;
  font-family: "Microsoft YaHei", "SimHei", "Segoe UI", sans-serif;
}

#stage {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#game {
  display: block;
  background-color: #171310;
}

noscript {
  position: absolute;
  top: 40%;
  left: 0;
  width: 100%;
  text-align: center;
  color: #F0D9A8;
  font-size: 18px;
}
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="720" height="1280"></canvas>
  </div>
  <noscript>本游戏需要启用 JavaScript。</noscript>

  <script>

    if (p[0] === 'tiao') return { text: String(n) + '条', color: '#2E7D32' };
    if (p[0] === 'tong') return { text: String(n) + '筒', color: '#26558F' };

    function drawBoard(game) {

          badge.style.overflow = 'hidden';
