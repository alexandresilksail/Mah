<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Mah了个Mah</title>
  <style>
/* Mah Le Mah - 全部样式内联，无外部字体 / 图片 */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #191009;
  /* 纯 CSS 渐变背景，无位图资源 */
  background-image:
    radial-gradient(120% 80% at 50% 0%, #4a3323 0%, #2a1c13 45%, #150e09 100%);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
}

#stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

#game {
  display: block;
  background: transparent;
  image-rendering: auto;
  cursor: pointer;
  /* 等比缩放到视口内（contain），永远不裁切；JS 只负责背板分辨率 */
  width: min(100vw, calc(100vh * 0.5625));
  aspect-ratio: 720 / 1280;
  max-width: 100vw;
  max-height: 100vh;
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.65);
  border-radius: 4px;
}

noscript {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f0d9a8;
  font-size: 18px;
}
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="720" height="1280" aria-label="Mah Le Mah game canvas"></canvas>
  </div>
