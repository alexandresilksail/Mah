      ctx2.moveTo(0.52, 0);
      ctx2.lineTo(0.94, -0.46);
      ctx2.lineTo(0.94, 0.46);
      ctx2.closePath();
      ctx2.fill();
      ctx2.fillStyle = t.accent;
      ctx2.beginPath();
      ctx2.moveTo(-0.12, -0.3);
      ctx2.lineTo(0.2, -0.62);
      ctx2.lineTo(0.32, -0.28);
      ctx2.closePath();
      ctx2.fill();
      filledCircle(ctx2, -0.38, -0.1, 0.09, "#FFFFFF");
      filledCircle(ctx2, -0.4, -0.1, 0.045, "#20261F");
      ctx2.strokeStyle = t.accent;
      ctx2.lineWidth = 0.07;
      ctx2.beginPath();
      ctx2.moveTo(-0.1, 0.18);
      ctx2.lineTo(0.38, 0.18);
      ctx2.stroke();
    },
    moon(ctx2, t) {
      filledCircle(ctx2, 0.05, 0, 0.76, t.ink);
      filledCircle(ctx2, 0.42, -0.16, 0.64, t.face);
      filledCircle(ctx2, -0.48, -0.52, 0.1, t.accent);
      filledCircle(ctx2, -0.22, 0.56, 0.07, t.accent);
    },
    sun(ctx2, t) {
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI * 2 / 8;
        ctx2.strokeStyle = t.accent;
        ctx2.lineWidth = 0.12;
        ctx2.beginPath();
        ctx2.moveTo(Math.cos(a) * 0.52, Math.sin(a) * 0.52);
        ctx2.lineTo(Math.cos(a) * 0.9, Math.sin(a) * 0.9);
        ctx2.stroke();
      }
      filledCircle(ctx2, 0, 0, 0.48, t.ink);
      filledCircle(ctx2, 0, 0, 0.3, t.accent);
    },
    cloud(ctx2, t) {
      filledCircle(ctx2, -0.45, 0.1, 0.36, t.ink);
      filledCircle(ctx2, 0, -0.2, 0.48, t.ink);
      filledCircle(ctx2, 0.48, 0.1, 0.34, t.ink);
      ctx2.fillStyle = t.ink;
      ctx2.beginPath();
      ctx2.moveTo(-0.78, 0.14);
      ctx2.lineTo(0.78, 0.14);
      ctx2.lineTo(0.78, 0.5);
      ctx2.lineTo(-0.78, 0.5);
      ctx2.closePath();
      ctx2.fill();
      ctx2.strokeStyle = t.accent;
      ctx2.lineWidth = 0.09;
      ctx2.beginPath();
      ctx2.moveTo(-0.58, 0.34);
      ctx2.lineTo(0.58, 0.34);
      ctx2.stroke();
    },
    star(ctx2, t) {
      ctx2.fillStyle = t.ink;
      starPath(ctx2, 0, 0, 0.88, 0.38, 5);
      ctx2.fill();
      ctx2.fillStyle = t.accent;
      starPath(ctx2, 0, 0, 0.52, 0.22, 5);
      ctx2.fill();
      filledCircle(ctx2, 0, 0, 0.13, t.ink);
    }
  };
  function drawIcon(ctx2, type, cx, cy, boxW, boxH) {
    const fn = ICONS[type.icon];
    if (!fn) return;
    withBox(ctx2, type, cx, cy, boxW, boxH, (c, t) => {
      c.fillStyle = "rgba(255,255,255,0.72)";
      c.beginPath();
      c.ellipse(0, 0, 0.98, 0.98, 0, 0, Math.PI * 2);
      c.fill();
      fn(c, t);
    });
  }

  // src/game/config.js

  var LEVEL_SPEC = {

    },

      types: 16,

  var LAYOUT_SHAPE = {

    corePlanBase: [45, 39, 33, 27, 21, 9, 6],

    planJitter: 2,

    sideCount: 12,

    reserveCount: 36,

    bellyExtraPx: TILE_W / 2,

    topFillMin: 0.85,

    minEdgeGaps: 2
  };
  var LAYER_SHAPE = {
    planBase: LAYOUT_SHAPE.corePlanBase,
    colsBase: [9, 9, 10, 10, 7, 5, 3],
    bellyExtraPx: LAYOUT_SHAPE.bellyExtraPx,
    planJitter: LAYOUT_SHAPE.planJitter,
    fillMin: LAYOUT_SHAPE.fillMin,
    fillMax: LAYOUT_SHAPE.fillMax,
    topFillMin: LAYOUT_SHAPE.topFillMin,
    minEdgeGaps: LAYOUT_SHAPE.minEdgeGaps
  };
  var SLOT_PITCH = 78;
  var SLOT_PANEL = { x: 73, y: 1024, w: 574, h: 124, x0Pad: 14, y0Pad: 18 };
  var SLOT_CARD_W = TILE_W;

  var SLOT_X0 = SLOT_PANEL.x + SLOT_PANEL.x0Pad;
  var SLOT_Y = SLOT_PANEL.y + SLOT_PANEL.y0Pad;
  function makeLayout(level) {
    const spec = LEVEL_SPEC[level];
    return {
      tileW: TILE_W,
      tileH: TILE_H,
      pitchX: TILE_W,
      pitchY: TILE_H,

      plan: spec.plan.map((n, li) => ({ li, n })),
      slot: {
        x: SLOT_PANEL.x,

        cardW: SLOT_CARD_W,

        capacity: SLOT_CAPACITY
      }

  }
  var LAYOUTS = { 1: makeLayout(1), 2: makeLayout(2) };

})();
