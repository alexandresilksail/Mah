    /** 第 0–3 层每层至少留几处边缘缺口 */
    minEdgeGaps: 2
  };
  var SLOT_PITCH = 78;
  var SLOT_PANEL = { x: 73, y: 1024, w: 574, h: 124, x0Pad: 14, y0Pad: 18 };
  var SLOT_CARD_W = TILE_W;
  var SLOT_CARD_H = TILE_H;
  var SLOT_X0 = SLOT_PANEL.x + SLOT_PANEL.x0Pad;
  var SLOT_Y = SLOT_PANEL.y + SLOT_PANEL.y0Pad;
  function makeLayout(level) {
    const spec = LEVEL_SPEC[level];
    return {
      tileW: TILE_W,
      tileH: TILE_H,
      pitchX: TILE_W,
      pitchY: TILE_H,
      jitter: 0,
      plan: spec.plan.map((n, li) => ({ li, n })),
      // ES5 降级视图画槽位面板时用的绝对坐标（不能 import，只能从 game.layout 读）
      slot: {
        x: SLOT_PANEL.x,
        y: SLOT_PANEL.y,
        w: SLOT_PANEL.w,
        h: SLOT_PANEL.h,
        x0: SLOT_X0,
        y0: SLOT_Y,
        pitch: SLOT_PITCH,
        padX: SLOT_PANEL.x0Pad,
        padY: SLOT_PANEL.y0Pad,
        cardW: SLOT_CARD_W,
        cardH: SLOT_CARD_H,
        capacity: SLOT_CAPACITY
      }
    };
  }
  var LAYOUTS = { 1: makeLayout(1), 2: makeLayout(2) };

  // <stdin>
  var COLS = 5;
  var TW = 150;
  var TH = 172;
  var GAP = 14;
  var rows = Math.ceil(TYPE_LIST.length / COLS);
  var W = COLS * (TW + GAP) + GAP;
  var H = rows * (TH + GAP) + GAP + 40;
  var cv = document.createElement("canvas");
  cv.width = W;
  cv.height = H;
  document.body.appendChild(cv);
  var ctx = cv.getContext("2d");
  ctx.fillStyle = "#3A2A1E";
  ctx.fillRect(0, 0, W, H);
  TYPE_LIST.forEach((t, i) => {
    const c = i % COLS, r = Math.floor(i / COLS);
    const x = GAP + c * (TW + GAP);
    const y = GAP + r * (TH + GAP);
    drawTile(ctx, x, y, TW, TH, t.id, {});
    ctx.fillStyle = "rgba(255,240,210,0.55)";
    ctx.font = "600 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(t.id, x + TW / 2, y + TH + 14);
  });
  var small = document.createElement("canvas");
  var ROW_H = TILE_H + 12;
  small.width = 720;
  small.height = ROW_H * 3 + 10;
  small.style.display = "block";
  small.style.marginTop = "8px";
  document.body.appendChild(small);
  var c2 = small.getContext("2d");
  c2.fillStyle = "#3A2A1E";
  c2.fillRect(0, 0, 720, small.height);
  var states = [
    { name: "可点", opt: { playable: true } },
    { name: "压 1 层", opt: { dimLevel: 1 } },
    { name: "压 4 层", opt: { dimLevel: 4 } }
  ];
  ["yaoji", "zi-zhong", "tong-5", "tiao-9", "zi-dong", "tong-1"].forEach((id, i) => {
    states.forEach((st, r) => drawTile(c2, 10 + i * 116, 8 + r * ROW_H, TILE_W, TILE_H, id, st.opt));
  });
  document.title = "tile sheet";
})();
</script></body></html>
