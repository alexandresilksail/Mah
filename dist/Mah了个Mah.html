* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #F7EEDC;
  /* 纯 CSS 渐变背景，无位图资源 */
  background-image:
    radial-gradient(120% 80% at 50% 0%, #FFFDF6 0%, #F7EEDC 45%, #EFDFC2 100%);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
}

#stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

#game {
  display: block;
  background: transparent;
  image-rendering: auto;
  cursor: pointer;
  /* 等比缩放到视口内（contain），永远不裁切；JS 只负责背板分辨率 */
  width: min(100vw, calc(100vh * 0.5625));
  aspect-ratio: 720 / 1280;
  max-width: 100vw;
  max-height: 100vh;
  box-shadow: 0 0 60px rgba(150, 112, 70, 0.28);
  border-radius: 4px;
}

noscript {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #4A3524;
  font-size: 18px;
}
